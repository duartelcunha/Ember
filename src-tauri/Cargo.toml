[package]
name = "ember"
version.workspace = true
description = "Ember: refinador de prompts no momento, em qualquer app."
authors.workspace = true
edition.workspace = true

[lib]
# O sufixo `_lib` evita conflito entre a lib e o bin no Windows (rust-lang/cargo#8519).
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` expoe o inspetor tambem em release, para o modo debug o poder abrir sob demanda
# (fica atras do toggle `debug_mode`; um utilizador normal nunca o ve). `macos-private-api`
# permite as janelas transparentes no macOS (no-op no Windows, gated internamente).
tauri = { version = "2", features = ["tray-icon", "devtools", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
# Logging estruturado: ficheiro rotativo no log dir (+ stdout em debug). O chao do modo debug
# e das breadcrumbs que antes eram engolidas com `let _ =`.
tauri-plugin-log = "2"
log = "0.4"
ember-core = { path = "../crates/ember-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Resiliencia / providers
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# `net`/`io-util`: o servidor de callback do login com a conta ChatGPT (um TcpListener em
# localhost que recebe UM pedido do browser e fecha). Ver `oauth.rs`.
tokio = { version = "1", features = ["time", "sync", "macros", "net", "io-util"] }
# PKCE do login com a conta ChatGPT: SHA-256 do verifier, e bytes de um CSPRNG do SO para o
# verifier e o state. O `jitter01()` dos retries NAO serve aqui (o relogio e adivinhavel).
sha2 = "0.10"
ring = "0.17.14"
getrandom = "0.2"
# Consumir o body de streaming (SSE) como Stream<Item = Bytes>: so o essencial (sem runtime,
# sem executor), a mesma peca que o proprio reqwest usa internamente para bytes_stream().
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Storage seguro das chaves. O backend nativo e OBRIGATORIO em cada SO: sem ele, o keyring cai
# num mock store que nao persiste nada. Gates por plataforma: Windows Credential Manager em
# Windows, Keychain on macOS, Secret Service on Linux.
keyring = "3"

# Adapters nativos do loop in-place: enigo (simular Ctrl+C/Ctrl+V),
# arboard (clipboard sincrono, deteta nao-texto).
enigo = "0.3"
arboard = "3"
tauri-plugin-dialog = "2.7.1"

# Deteta a app em foco (terminal -> Ctrl+Shift+C/V). Versao 0.61 ja esta na arvore.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # Win32_Security: token de elevacao (`GetTokenInformation`/`TokenElevation`), para o
    # diagnostico poder dizer que a hotkey nao dispara sobre janelas elevadas.
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }
keyring = { version = "3", features = ["windows-native"] }

# Bug B: sem o backend `apple-native`, o keyring em macOS usa um mock store e as chaves nao
# persistem na Keychain. (A feature so compila em macOS; em Windows o `windows-native` acima
# e que ativa.)
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Persist in the desktop vault. Never fall back to keyring's in-memory mock on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Auto-update assinado (so desktop: o updater nao suporta mobile).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
base64 = "0.22.1"
minisign-verify = "0.2.5"

[features]
native-qualification = ["tauri/custom-protocol"]

[[example]]
name = "floating_native"
required-features = ["native-qualification"]
