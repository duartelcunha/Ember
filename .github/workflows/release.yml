name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains the standing release PR; on merge, tags + drafts the GitHub Release.
  # Runs in the SAME workflow as the build below (not a separate tag-triggered one):
  # a tag created via GITHUB_TOKEN does not cascade to trigger other workflows, so a
  # `push: tags:` workflow would never fire for release-please's own tags.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    steps:
      # Release Please creates a draft and its tag. A previous candidate was public before
      # its installer finished building, so check both the draft and the tag before work starts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Assert draft release and exact source tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: pwsh
        run: ./scripts/assert-draft-release.ps1 -Tag $env:TAG -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY

      - name: Keep the draft off the stable channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: pwsh
        run: gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft --prerelease --latest=false

      - name: Reconfirm draft and prerelease state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: pwsh
        run: ./scripts/assert-draft-release.ps1 -Tag $env:TAG -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY -RequirePrerelease

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e1648915a4fdfbb5afab579a8afeb8eba8f6528c # 1.96.1
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      # release-please bumps the workspace version in Cargo.toml and leaves Cargo.lock alone, so
      # the lock still names the previous version of `ember` and `ember-core`. Every cargo step
      # below passes --locked, which exists to prove no DEPENDENCY moved, and it refused: the one
      # thing that had to move was the workspace's own version. This updates exactly that, the two
      # workspace members and nothing else, and then --locked means what it was meant to mean.
      # Without it the release build fails after the tag and draft release already exist.
      - name: Carry the version bump into Cargo.lock
        run: cargo update --workspace

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify package.json and Cargo.toml versions are in sync
        run: npm run version:check

      # Gate the artifact on the test suite before a human verifies and publishes it.
      - name: Run tests
        run: cargo test --workspace --locked

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release publication guard regressions
        shell: pwsh
        run: |
          ./scripts/publication-guards.test.ps1
          ./scripts/assert-draft-release.test.ps1

      - name: Frontend regression tests
        run: npm test

      # Typecheck the frontend before building the bundle (tauri-action runs `vite build`
      # via beforeBuildCommand, but this surfaces a tsc failure as its own clear step).
      - name: Typecheck frontend
        run: npm run build

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseCommitish: ${{ github.sha }}
          releaseName: 'Ember ${{ needs.release-please.outputs.tag_name }}'
          releaseDraft: true
          # Keep it a prerelease during upload (the first step of this job made sure it is one).
          # The updater endpoint /releases/latest skips prereleases, so installed copies stay on
          # the last full release until the installer + latest.json are actually attached.
          prerelease: true

      # Every release leaves this job as a draft. A stable tag is promoted by hand with
      # scripts/verify-prerelease.ps1 -Promote, after the installer and updater signature are
      # verified against this checkout and native evidence for the platform in scope is
      # recorded in docs/native-qualification.md.
