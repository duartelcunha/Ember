name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains the standing release PR; on merge, tags + publishes the GitHub Release.
  # Runs in the SAME workflow as the build below (not a separate tag-triggered one):
  # a tag created via GITHUB_TOKEN does not cascade to trigger other workflows, so a
  # `push: tags:` workflow would never fire for release-please's own tags.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e1648915a4fdfbb5afab579a8afeb8eba8f6528c # 1.96.1
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify package.json and Cargo.toml versions are in sync
        run: npm run version:check

      # Gate the release on the test suite: never publish a build to auto-updating users
      # if the pure logic (retry/fallback, prompt, capture) or the shell tests fail.
      - name: Run tests
        run: cargo test --workspace --locked

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Frontend regression tests
        run: npm test

      # Typecheck the frontend before building the bundle (tauri-action runs `vite build`
      # via beforeBuildCommand, but this surfaces a tsc failure as its own clear step).
      - name: Typecheck frontend
        run: npm run build

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseCommitish: ${{ github.sha }}
          releaseName: 'Ember ${{ needs.release-please.outputs.tag_name }}'
          releaseDraft: true
          # Keep it a prerelease during upload (release-please created it as one). The updater
          # endpoint /releases/latest skips prereleases, so users stay on the last full release
          # until the installer + latest.json are actually attached below.
          prerelease: true

      # This channel remains a prerelease. Promotion requires recorded native qualification
      # on all supported platforms and verification of installer and updater signatures.
